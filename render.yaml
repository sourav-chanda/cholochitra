services:
  - type: web
  - name: cholochitra
    env: php
    plan: free
    buildCommand: "composer install --optimize-autoloader --no-dev && php artisan config:cache && php artisan route:cache"
    startCommand: "apache2-foreground"
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false